name: release-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate CITATION.cff against pinned official CFF 1.2.0 schema
        shell: bash
        run: |
          python -m pip install --upgrade pyyaml jsonschema
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          import yaml
          import jsonschema

          schema_url = (
              "https://raw.githubusercontent.com/"
              "citation-file-format/citation-file-format/"
              "0c5b4aa07071490eaf261775ce96ccdd13a6e2d5/schema.json"
          )
          with urllib.request.urlopen(schema_url) as response:
              schema = json.load(response)

          data = yaml.safe_load(Path("CITATION.cff").read_text(encoding="utf-8"))
          validator = jsonschema.Draft7Validator(
              schema=schema,
              format_checker=jsonschema.FormatChecker(),
          )
          errors = sorted(validator.iter_errors(data), key=lambda e: list(e.path))
          if errors:
              for error in errors:
                  print(f"{list(error.path)}: {error.message}")
              raise SystemExit("CITATION.cff failed official CFF 1.2.0 schema validation")

          assert data["cff-version"] == "1.2.0"
          assert data["version"] == "2.0.0"
          assert data["type"] == "software"
          assert data["license"] == "BSD-3-Clause"
          assert data["doi"] == "10.5281/zenodo.22379576"
          assert data["date-released"] == "2026-09-05"
          assert all("orcid" not in author for author in data["authors"])
          text = Path("CITATION.cff").read_text(encoding="utf-8")
          assert not any(x in text for x in ("TO_REVIEW", "TO_SELECT", "TO_RELEASE"))
          print("CITATION.cff: official CFF 1.2.0 schema PASS")
          PY

  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build and test frontends
        run: python -m pip install --upgrade pip build pytest threadpoolctl
      - name: Build distributions
        run: python -m build
      - name: Verify public metadata is included in sdist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise SystemExit(f"expected exactly one sdist, found {len(sdists)}")
          with tarfile.open(sdists[0], "r:gz") as tf:
              names = set(tf.getnames())
          roots = {name.split("/", 1)[0] for name in names if "/" in name}
          if len(roots) != 1:
              raise SystemExit(f"unexpected sdist roots: {sorted(roots)}")
          root = next(iter(roots))
          for rel in ("CITATION.cff", "AUTHORS.md"):
              target = f"{root}/{rel}"
              if target not in names:
                  raise SystemExit(f"missing public metadata from sdist: {target}")
          historical_template = f"{root}/CITATION.cff.template"
          if historical_template in names:
              raise SystemExit(
                  "historical placeholder CITATION.cff.template must not be shipped in public sdist"
              )
          print("sdist active metadata inclusion / historical-template exclusion: PASS")
          PY
      - name: Verify wheel core metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as zf:
              metadata_names = [
                  name for name in zf.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_names) != 1:
                  raise SystemExit(
                      f"expected exactly one wheel METADATA file, found {metadata_names}"
                  )
              text = zf.read(metadata_names[0]).decode("utf-8")

          required = [
              "Version: 2.0.0",
              "BSD-3-Clause",
              "Jorge Luís Braga Ribes",
              "Maicon Nardino",
              "Régis Sperotto de Quadros",
              "Daniela Buske",
              "Luís Carlos Timm",
              "Willian Silva Barros",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f"wheel METADATA missing reviewed release fields: {missing}")
          print("wheel core metadata: PASS")
          PY
      - name: Install built wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          wheels = sorted(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected exactly one wheel, found {len(wheels)}')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheels[0])])
          PY
      - name: Run 396-test release-transition suite
        shell: bash
        run: |
          python -m pytest 02_TESTS 03_RELEASE_TESTS -ra \
            --deselect=02_TESTS/test_qa050_engineering_reproducibility_baseline.py::test_qa050_02_governed_tree_matches_pyproject \
            --deselect=02_TESTS/test_qa051_environment_ci_matrix.py::test_qa051_06_local_reference_versions_are_explicit_and_match_runtime \
            --deselect=02_TESTS/test_qa053_dependency_lock.py::test_qa053_08_local_resolution_matches_direct_runtime_stack \
            --deselect=02_TESTS/test_qa054_release_metadata.py::test_qa054_02_known_project_metadata_matches_pyproject \
            --deselect=02_TESTS/test_qa054_release_metadata.py::test_qa054_05_template_placeholders_block_public_release_readiness \
            --deselect=02_TESTS/test_qa054_release_metadata.py::test_qa054_06_pyproject_does_not_guess_license \
            --deselect=02_TESTS/test_qa054_release_metadata.py::test_qa054_07_pyproject_does_not_guess_software_authors \
            --deselect=02_TESTS/test_qa054_release_metadata.py::test_qa054_10_metadata_evidence_reports_hold_not_release_ready \
            --deselect=02_TESTS/test_qa055_clean_room_release_reproducibility.py::test_qa055_11_unresolved_qa054_metadata_still_blocks_public_release \
            --deselect=02_TESTS/test_qa056_documentation_provenance.py::test_qa056_07_citation_and_license_remain_qa054_holds_not_fabricated \
            --deselect=02_TESTS/test_release_readiness_qa058.py::test_qa058_05_public_version_authorship_license_and_citation_remain_hold \
            --deselect=02_TESTS/test_release_readiness_qa058.py::test_qa058_08_audit_pass_does_not_mean_archival_release_ready \
            --deselect=02_TESTS/test_release_readiness_qa058.py::test_qa058_10_campaign_reports_ready_and_hold_roles_without_promotion \
            --deselect=03_RELEASE_TESTS/test_step_f2_release_metadata.py::test_authorship_orcid_and_doi_are_not_inferred
      - name: Record environment
        run: python -m pip freeze
