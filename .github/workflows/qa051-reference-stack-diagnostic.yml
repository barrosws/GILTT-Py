name: qa051-reference-stack-diagnostic

on:
  push:
    branches:
      - step-f5a-qa051-reference-stack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa051-reference:
    name: QA051 reference stack / Ubuntu 24.04 / Python 3.13.5
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up exact Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip

      - name: Verify exact Python patch release
        shell: bash
        run: |
          python - <<'PY'
          import sys
          observed = sys.version_info[:3]
          expected = (3, 13, 5)
          print("python_observed =", observed)
          print("python_expected =", expected)
          if observed != expected:
              raise SystemExit(f"Expected Python {expected}, observed {observed}")
          PY

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build wheel from branch source
        run: python -m build --wheel

      - name: Install exact QA051 runtime/test stack and wheel without dependency resolution
        shell: bash
        run: |
          python -m pip install --force-reinstall             "numpy==2.3.5"             "scipy==1.17.0"             "mpmath==1.3.0"             "pytest==9.0.2"             "threadpoolctl==3.6.0"
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              "--force-reinstall", "--no-deps", str(wheels[0])
          ])
          PY

      - name: Record exact runtime before QA043
        shell: bash
        run: |
          python -m pip freeze | tee step_f5a_pip_freeze.txt
          python - <<'PY'
          import io
          import json
          import platform
          import sys
          from pathlib import Path

          import mpmath
          import numpy as np
          import pytest
          import scipy
          import threadpoolctl

          expected = {
              "python": "3.13.5",
              "numpy": "2.3.5",
              "scipy": "1.17.0",
              "mpmath": "1.3.0",
              "pytest": "9.0.2",
              "threadpoolctl": "3.6.0",
          }
          observed = {
              "python": platform.python_version(),
              "numpy": np.__version__,
              "scipy": scipy.__version__,
              "mpmath": mpmath.__version__,
              "pytest": pytest.__version__,
              "threadpoolctl": threadpoolctl.__version__,
          }
          payload = {
              "schema": "gilttpy.step-f5a.qa051-reference-runtime.v1",
              "expected": expected,
              "observed": observed,
              "platform": platform.platform(),
              "machine": platform.machine(),
              "python_executable": sys.executable,
              "threadpools": threadpoolctl.threadpool_info(),
              "environment": {
                  "OPENBLAS_NUM_THREADS": __import__("os").environ.get("OPENBLAS_NUM_THREADS"),
                  "OMP_NUM_THREADS": __import__("os").environ.get("OMP_NUM_THREADS"),
                  "MKL_NUM_THREADS": __import__("os").environ.get("MKL_NUM_THREADS"),
                  "PYTHONHASHSEED": __import__("os").environ.get("PYTHONHASHSEED"),
              },
          }
          Path("step_f5a_qa051_reference_runtime.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if observed != expected:
              raise SystemExit(f"Reference stack mismatch: {observed!r}")

          buf = io.StringIO()
          old = sys.stdout
          try:
              sys.stdout = buf
              np.show_config()
          finally:
              sys.stdout = old
          Path("step_f5a_numpy_config.txt").write_text(buf.getvalue(), encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Run QA043 only under exact QA051 reference stack
        shell: bash
        run: |
          set -o pipefail
          python -m pytest             02_TESTS/test_qa043_transient_variable_coefficient_benchmark.py             -vv -ra --tb=long 2>&1 | tee step_f5a_qa043_pytest.log

      - name: Record QA043 six-point error vector
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("02_TESTS").resolve()))
          from test_qa043_transient_variable_coefficient_benchmark import _exact_spectral
          from gilttpy.validation.transient_variable_coefficient import (
              spectral_dehoog_concentration_from_inlet,
          )

          c, system, y0 = _exact_spectral()
          x = 4.0
          z = 3.0
          times = (2.1, 2.2, 2.3, 2.75, 3.0, 5.0)
          rows = []
          for t in times:
              got = spectral_dehoog_concentration_from_inlet(
                  system, y0, x, z, t, degree=28, working_dps=40
              )
              ref = float(c.exact_concentration(x, [z], t)[0])
              rel = abs(got - ref) / ref
              rows.append({
                  "t": t,
                  "got": float(got),
                  "reference": ref,
                  "relative_error": float(rel),
              })

          errors = [r["relative_error"] for r in rows]
          checks = {
              "e_t2_1_lt_2e-4": errors[0] < 2e-4,
              "e_t2_2_lt_1e-5": errors[1] < 1e-5,
              "e_t2_3_lt_1e-6": errors[2] < 1e-6,
              "max_far_lt_1e-8": max(errors[3:]) < 1e-8,
              "near_front_monotone": errors[2] < errors[1] < errors[0],
          }
          payload = {
              "schema": "gilttpy.step-f5a.qa043-error-vector.v1",
              "x": x,
              "z": z,
              "degree": 28,
              "working_dps": 40,
              "rows": rows,
              "max_far_error": max(errors[3:]),
              "checks": checks,
              "all_checks_pass": all(checks.values()),
          }
          Path("step_f5a_qa043_error_vector.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload STEP F5A diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-f5a-qa051-reference-stack-evidence
          path: |
            step_f5a_pip_freeze.txt
            step_f5a_qa051_reference_runtime.json
            step_f5a_numpy_config.txt
            step_f5a_qa043_pytest.log
            step_f5a_qa043_error_vector.json
          if-no-files-found: warn
