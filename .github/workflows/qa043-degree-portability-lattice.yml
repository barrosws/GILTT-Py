name: qa043-degree-portability-lattice

on:
  push:
    branches:
      - step-f5d-qa043-degree-portability-lattice
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: QA043 degree lattice / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build and install branch wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build pytest threadpoolctl
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              "--force-reinstall", str(wheels[0])
          ])
          PY

      - name: Map degree portability lattice
        shell: bash
        run: |
          python - <<'PY'
          import json
          import platform
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("02_TESTS").resolve()))

          import mpmath
          import numpy as np
          import scipy
          import threadpoolctl

          from test_qa043_transient_variable_coefficient_benchmark import _exact_spectral
          from gilttpy.numerics.inverse_laplace_modern import dehoog_inverse_laplace
          from gilttpy.validation.transient_variable_coefficient import (
              spectral_dehoog_concentration_from_inlet,
          )

          c, system, y0 = _exact_spectral()
          x = 4.0
          z = 3.0
          times = (2.1, 2.2, 2.3, 2.75, 3.0, 5.0)
          degrees = (16, 18, 20, 22, 24, 26, 28, 30)

          def envelope(errors):
              return {
                  "e_t2_1_lt_2e-4": errors[0] < 2e-4,
                  "e_t2_2_lt_1e-5": errors[1] < 1e-5,
                  "e_t2_3_lt_1e-6": errors[2] < 1e-6,
                  "max_far_lt_1e-8": max(errors[3:]) < 1e-8,
                  "near_front_monotone": errors[2] < errors[1] < errors[0],
              }

          degree_rows = []
          for degree in degrees:
              rows = []
              for t in times:
                  got = spectral_dehoog_concentration_from_inlet(
                      system, y0, x, z, t, degree=degree, working_dps=40
                  )
                  ref = float(c.exact_concentration(x, [z], t)[0])
                  rows.append({
                      "t": t,
                      "got": float(got),
                      "reference": ref,
                      "relative_error": float(abs(got-ref)/ref),
                  })
              errors = [r["relative_error"] for r in rows]
              checks = envelope(errors)
              degree_rows.append({
                  "degree": degree,
                  "working_dps": 40,
                  "rows": rows,
                  "max_far_error": max(errors[3:]),
                  "checks": checks,
                  "all_checks_pass": all(checks.values()),
              })

          # Independent inversion-only control on the exact analytical transform.
          exact_control = []
          for degree in degrees:
              per_t = []
              for t in times:
                  ref = float(c.exact_concentration(x, [z], t)[0])
                  got = dehoog_inverse_laplace(
                      lambda s: complex(c.exact_laplace_concentration(x, [z], s)[0]),
                      t,
                      degree=degree,
                      working_dps=40,
                  )
                  per_t.append(float(abs(got-ref)/ref))
              exact_control.append({
                  "degree": degree,
                  "errors": per_t,
                  "max_error": max(per_t),
              })

          payload = {
              "schema": "gilttpy.step-f5d.qa043-degree-portability-lattice.v1",
              "platform": platform.platform(),
              "machine": platform.machine(),
              "python": platform.python_version(),
              "versions": {
                  "numpy": np.__version__,
                  "scipy": scipy.__version__,
                  "mpmath": mpmath.__version__,
                  "threadpoolctl": threadpoolctl.__version__,
              },
              "threadpools": threadpoolctl.threadpool_info(),
              "times": list(times),
              "degrees": list(degrees),
              "degree_results": degree_rows,
              "passing_degrees": [
                  r["degree"] for r in degree_rows if r["all_checks_pass"]
              ],
              "exact_transform_inversion_control": exact_control,
              "interpretation": {
                  "purpose": "diagnostic feasibility map; not a post-hoc production-degree selector",
                  "common_degree_required_for_fixed_degree_policy":
                      "a candidate fixed degree must pass the frozen QA043 envelope independently in every matrix cell before any production proposal is considered",
              },
          }

          safe_os = platform.system().lower()
          safe_py = f"{sys.version_info.major}{sys.version_info.minor}"
          out = Path(f"step_f5d_{safe_os}_py{safe_py}.json")
          out.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "platform": payload["platform"],
              "python": payload["python"],
              "versions": payload["versions"],
              "passing_degrees": payload["passing_degrees"],
              "summary": [
                  {
                      "degree": r["degree"],
                      "all_checks_pass": r["all_checks_pass"],
                      "max_far_error": r["max_far_error"],
                      "failed_checks": [
                          k for k, v in r["checks"].items() if not v
                      ],
                  }
                  for r in degree_rows
              ],
              "exact_transform_inversion_control": exact_control,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload cell evidence
        uses: actions/upload-artifact@v4
        with:
          name: step-f5d-${{ matrix.os }}-py${{ matrix.python }}
          path: step_f5d_*.json
          if-no-files-found: error
