[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gilttpy"
version = "2.0.0"
description = "Verified spectral-Laplace framework for atmospheric advection-diffusion research"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "mpmath>=1.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "threadpoolctl>=3",
]

[tool.setuptools]
package-dir = {"" = "01_SRC"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["01_SRC"]
include = ["gilttpy*"]

[tool.pytest.ini_options]
testpaths = ["02_TESTS"]
addopts = "-ra"
